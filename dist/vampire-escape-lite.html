<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vampire Escape</title>
<meta name="description" content="An old-school C64-style gothic text adventure: escape Count Dracula's castle before midnight.">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VAMPIRE ESCAPE - C64 look */
:root {
--border: #6c5eb5;   /* light blue */
--bg: #352879;       /* blue */
--fg: #6c5eb5;       /* light blue */
--white: #ffffff;
--yellow: #b8c76f;
--cyan: #70a4b2;
--green: #9ad284;
--red: #68372b;
--grey: #959595;
--key: #433900;
/* softer, easier-on-the-eye versions (follow each land's colours) */
--text: color-mix(in srgb, var(--fg) 30%, #f1eee4);
--soft-yellow: color-mix(in srgb, var(--yellow) 55%, #f1eee4);
--soft-cyan: color-mix(in srgb, var(--cyan) 55%, #f1eee4);
--soft-green: color-mix(in srgb, var(--green) 60%, #f1eee4);
--soft-grey: color-mix(in srgb, var(--fg) 35%, #b9b6b0);
--bar: color-mix(in srgb, var(--fg) 55%, var(--bg));
--pixel: "Press Start 2P", "Courier New", monospace;
--read: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
margin: 0;
padding: 16px;
background: color-mix(in srgb, var(--border) 70%, #0d0b1e);
display: flex; align-items: center; justify-content: center;
font-family: var(--read);
color: var(--text);
transition: background .15s;
}
body.loading { animation: stripes .09s steps(1) infinite; }
@keyframes stripes {
0%   { background: repeating-linear-gradient(0deg, #68372b 0 7px, #70a4b2 7px 13px, #b8c76f 13px 18px, #352879 18px 26px, #9a6759 26px 31px); }
50%  { background: repeating-linear-gradient(0deg, #6f3d86 0 5px, #588d43 5px 12px, #6c5eb5 12px 19px, #6f4f25 19px 24px, #ffffff 24px 26px); }
}
body.flash-die { background: #68372b !important; }
body.flash-part { animation: rainbow .12s steps(1) 5; }
@keyframes rainbow { 0% { background: #b8c76f; } 33% { background: #9ad284; } 66% { background: #70a4b2; } }
#screen {
position: relative;
width: min(100%, 760px);
height: min(100%, 920px);
background: var(--bg);
padding: 14px;
display: flex; flex-direction: column;
font-size: clamp(18px, 2.5vw, 23px);
line-height: 1.3;
box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 8px 40px rgba(0,0,0,.35);
overflow: hidden;
}
#screen.crt::after {
content: ""; position: absolute; inset: 0; pointer-events: none;
background: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
}
#status {
display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap;
background: var(--bar); color: var(--text);
font-family: var(--pixel); font-size: clamp(8px, 1.3vw, 11px); line-height: 1.6;
padding: 5px 8px; margin-bottom: 10px; text-transform: uppercase;
}
#pic {
display: block; width: 100%; aspect-ratio: 16 / 5; flex: none;
image-rendering: pixelated; image-rendering: crisp-edges;
background: #000;
}
#out {
flex: 1; min-height: 6em; overflow-y: auto; margin-top: 10px;
word-wrap: break-word; padding-right: 4px;
scrollbar-width: thin; scrollbar-color: var(--fg) var(--bg);
}
.ln { white-space: pre-wrap; color: var(--text); margin-bottom: 2px; }
.ln.head { color: var(--text); background: var(--bar); display: inline-block; padding: 3px 8px 2px; margin-top: 8px;
font-family: var(--pixel); font-size: .5em; line-height: 1.6; letter-spacing: .02em; }
.ln.items { color: var(--soft-yellow); }
.ln.exits { color: var(--soft-cyan); }
.ln.good { color: var(--soft-green); }
.ln.warn { color: var(--soft-yellow); }
.ln.sys { color: var(--soft-grey); }
.ln.echo { color: #fbf8ef; margin-top: 10px; opacity: .9; }
.ln.die { color: #f6ded6; background: color-mix(in srgb, var(--red) 75%, var(--bg)); padding: 1px 6px; }
.ln.part { color: var(--bg); background: var(--soft-yellow); padding: 1px 6px; animation: glow 1.2s ease-in-out 2; }
@keyframes glow { 50% { background: #f1eee4; } }
#cmdline {
position: relative; display: flex; align-items: center; min-height: 2em;
color: #fbf8ef; cursor: text; margin-top: 4px;
}
.prompt { margin-right: .5em; color: var(--soft-cyan); }
#typed { white-space: pre; overflow: hidden; }
#cursor { color: var(--soft-cyan); animation: cur 1s steps(1) infinite; }
@keyframes cur { 50% { opacity: 0; } }
#cmd {
position: absolute; inset: 0; width: 100%; opacity: 0;
font: inherit; border: 0; background: transparent; color: transparent;
}
#keys { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
#keys button, .box button {
font-family: var(--pixel); font-size: clamp(9px, 1.3vw, 11px); cursor: pointer;
background: color-mix(in srgb, var(--key) 70%, var(--bg)); color: #e6e2d6; border: 0;
border-bottom: 3px solid #1a1500; border-right: 3px solid #1a1500;
padding: 8px 10px; min-width: 3em;
}
#keys button:active, .box button:active { transform: translate(1px, 1px); border-width: 0 2px 2px 0; }
#keys button:focus-visible, .box button:focus-visible { outline: 2px solid var(--white); }
.overlay {
position: absolute; inset: 0; z-index: 5;
background: var(--bg); color: var(--text);
display: flex; align-items: center; justify-content: center; padding: 14px;
}
.overlay.hidden { display: none; }
#boot { font-family: var(--pixel); font-size: clamp(8px, 1.5vw, 12px); line-height: 1.8; color: var(--fg); align-items: flex-start; justify-content: flex-start; white-space: pre-wrap; flex-direction: column; }
.box {
width: min(100%, 520px); max-height: 100%; overflow-y: auto;
border: 3px solid var(--bar); padding: 16px;
}
.box.wide { width: min(100%, 700px); }
.box-title { background: var(--bar); color: var(--text); padding: 4px 8px; margin-bottom: 10px; font-family: var(--pixel); font-size: .5em; line-height: 1.6; }
.box-title.small { margin-top: 12px; }
.box ul { list-style: none; padding: 0; margin: 0 0 8px; }
.box li { color: var(--text); }
.box li::before { content: "* "; color: var(--soft-cyan); }
.dim { color: var(--soft-grey); margin-top: 10px; }
.dim a { color: var(--soft-cyan); }
#inv-slots { display: grid; grid-template-columns: repeat(7, minmax(0, 34px)); gap: 4px; margin-bottom: 8px; }
#inv-slots span { aspect-ratio: 1; border: 2px solid var(--bar); }
#inv-slots span.on { background: var(--soft-yellow); border-color: var(--soft-yellow); box-shadow: inset 0 0 0 3px var(--bg); }
#modtext {
width: 100%; height: 14em; resize: vertical; margin-top: 8px;
font-family: "Courier New", monospace; font-size: 12px;
background: #000; color: var(--green); border: 2px solid var(--fg); padding: 6px;
}
.row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
#modmsg { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: 12px; color: var(--yellow); max-height: 10em; overflow-y: auto; text-transform: none; }
#modlist li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
#modlist button { font-size: .75em; padding: 3px 6px; }
@media (max-width: 520px) {
body { padding: 8px 16px; }
#screen { padding: 8px; font-size: 18px; }
#keys button { padding: 8px 6px; }
}
#st-parts.alarm { color: #f6ded6; background: color-mix(in srgb, var(--red) 80%, var(--bg)); padding: 0 6px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .65; } }
</style>
</head>
<body class="loading">
<main id="screen" class="crt">
<div id="status" aria-live="off">
<span id="st-land">CASTLE</span>
<span id="st-score">SC 0000</span>
<span id="st-parts">DEED 00/7</span>
<span id="st-moves">--:-- PM</span>
</div>
<canvas id="pic" aria-label="Picture of the current location"></canvas>
<div id="out" role="log" aria-live="polite"></div>
<label id="cmdline" for="cmd">
<span class="prompt">&gt;</span><span id="typed"></span><span id="cursor">&#9608;</span>
<input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Type a command">
</label>
<nav id="keys" aria-label="Quick commands">
<button data-cmd="forward">F</button><button data-cmd="back">B</button>
<button data-cmd="left">L</button><button data-cmd="right">R</button>
<button data-cmd="up">U</button><button data-cmd="down">D</button>
<button data-cmd="look" class="wide">LOOK</button>
<button data-cmd="i">I</button>
<button data-cmd="hint" class="wide">HINT</button>
<button data-cmd="mods" class="wide">MODS</button>
<button data-cmd="help">?</button>
<button data-cmd="sound" class="wide">SND</button>
</nav>
<!-- Boot screen -->
<div id="boot" class="overlay"></div>
<!-- Inventory -->
<div id="invpanel" class="overlay hidden" role="dialog" aria-label="Inventory">
<div class="box">
<div class="box-title">INVENTORY</div>
<ul id="inv-items"></ul>
<div class="box-title small"><span id="inv-label">SHIP PARTS</span> <span id="inv-count"></span></div>
<div id="inv-slots"></div>
<ul id="inv-parts"></ul>
<div class="dim">PRESS ANY KEY</div>
</div>
</div>
<!-- Community map packs -->
<div id="mods" class="overlay hidden" role="dialog" aria-label="Community lands">
<div class="box wide">
<div class="box-title">COMMUNITY LANDS</div>
<p class="dim">Paste a map pack (JSON) below. Packs are data only - they can't run code.
See <a href="https://github.com/zkokio/vampire-escape/blob/main/docs/PACK_GUIDE.md" target="_blank" rel="noopener">docs/PACK_GUIDE.md</a>.</p>
<textarea id="modtext" spellcheck="false" placeholder='{ "format": 1, "id": "my-land", ... }'></textarea>
<div class="row">
<button id="mod-validate">VALIDATE</button>
<button id="mod-install">INSTALL</button>
<button id="mod-close">CLOSE</button>
</div>
<pre id="modmsg"></pre>
<div class="box-title small">INSTALLED</div>
<ul id="modlist"></ul>
</div>
</div>
</main>

<script>Starways.addPack({format:1,id:"core",type:"core",title:"Vampire Escape",game:{title:"VAMPIRE ESCAPE",tagline:"Escape Castle Dracula before midnight.",credit:"FLUSHTHEFASHION",machine:"DRACULA 64",load:"CASTLE",version:"1.0.0",colors:{border:4,bg:0,text:4},help:"Type HELP at any time. TAB or I shows your inventory. Keep an eye on the clock."},parts:{label:"DEED",total:7},collections:{curio:{label:"Curios",found:"CURIO FOUND",total:6}},ranks:[[0,"LOST GUEST"],[150,"WARY GUEST"],[350,"NIGHT WALKER"],[600,"CASTLE SLEUTH"],[850,"VAMPIRE HUNTER"],[1100,"MASTER OF ESCAPE"]],msg:{partFound:"DEED PIECE FOUND",partsName:"DEED PIECES",beacon:"SANCTUARY",beaconSave:"The sanctuary candle burns steady. PROGRESS SAVED.",beaconSaveManual:"PROGRESS SAVED BY THE SANCTUARY CANDLE.",restoreDie:"Darkness... then candlelight. You wake by the last sanctuary candle.",saveWhere:"You can only save by a SANCTUARY candle. They also save when you arrive.",codeWhere:"Reach a SANCTUARY candle first - that's where your game is saved.",dropPart:"Drop a piece of the deed? Not while it binds you to this house.",throwPart:"You keep hold of it. Every piece matters.",fix:"Some things here cannot be mended.",chaser:"DRACULA",newFloor:"Far above, the great clock ticks on. It is {time}.",helpSystem:"I = INVENTORY   HINT = CLUE (-5)   SCORE   SAVE (AT SANCTUARY CANDLES)   RESTORE   CODE (SAVE CODE)   GO TO <PLACE>   SOUND   CRT"},start:{inv:["watch","candle","matches","journal"]},intro:["Transylvania, 1897.","You are Jonathan Grey, a solicitor's clerk from London, sent to the Carpathians to complete the sale of a house in Piccadilly to a foreign nobleman.","You arrived at dusk. Dinner was laid for one. Your host did not eat.","Now you wake in the dark, and the door is locked from the outside.","The great clock of the castle is ticking towards midnight."],titlePic:[["grad",0,4,0,70],["stars",1,13,40,0,0,160,60],["stars",15,14,20,0,0,160,60],["circ",15,118,26,14],["circ",1,116,24,10],["plot",12,112,20,120,28,114,30],["poly",0,0,100,0,84,30,70,50,74,70,60,110,66,130,78,159,72,159,100],["rect",0,54,30,10,36],["poly",0,52,30,59,18,66,30],["rect",0,70,42,30,24],["rect",0,92,24,9,42],["poly",0,90,24,96,12,103,24],["rect",0,40,46,16,22],["poly",0,38,46,48,36,58,46],["rect",0,104,48,14,18],["plot",7,58,38,96,30,80,50,86,50,46,54,110,54],["line",0,20,30,24,28,28,30],["line",0,140,44,144,42,148,44],["line",0,130,12,133,10,136,12],["line",0,30,14,33,12,36,14],["dither",4,0,84,160,16]],items:{watch:{name:"pocket watch",words:["watch","pocket watch","time","clock"],desc:"Your father's silver pocket watch. It reads {time}. The Count rises at midnight."},candle:{name:[{if:"lit",text:"candle (lit)"},{text:"candle"}],words:["candle","stub","wax"],desc:[{if:"lit",text:"A stub of tallow candle, burning low and steady."},{text:"A stub of tallow candle. You could LIGHT it."}]},matches:{name:"box of matches",words:["matches","match","box","matchbox"],desc:"A box of Bryant & May matches from London. Comforting, somehow."},journal:{name:"journal",words:["journal","diary","notebook","notes"],desc:"Your travel journal. READ it to remind yourself of what you know.",read:[{if:"flag:castle:ivan_freed",text:"Your latest note, scrawled fast: 'Ivan says - when the deed burns, he wakes. Ready the carriage. Do not walk. RUN.'"},{if:"flag:castle:letter_read",text:"'3 May. Woke locked in. A letter from one IVAN PETROV, who came before me. The deed I signed binds me to this house. Seven pieces, hidden. Burn them on holy ground. Find them before midnight.'"},{text:"'3 May. Arrived Castle Dracula at sunset. The Count is courteous, very pale, and does not eat. Signed his papers after dinner. Felt strangely tired...'"}]}},actions:[{verb:"light",noun:"candle",once:!0,if:["!lit","has:matches"],do:[{set:"lit"},{say:"You strike a match. The flame catches the wick, and the dark draws back - a little."},{score:5},{sound:"good"},{command:"look"}]},{verb:"light",noun:"candle",if:["!lit","has:matches"],do:[{se <script>Starways.addPack({format:1,id:"castle",type:"main",order:1,title:"Castle Dracula",author:"FlushtheFashion",colors:{border:4,bg:0,text:4},intro:"Find the seven pieces of the deed. Burn them on holy ground. Escape before midnight.",start:"bedroom",floors:{1:{name:"UPPER FLOOR",start:"bedroom",minutes:110,colors:{border:4,bg:0,text:4}},2:{name:"GROUND FLOOR",start:"greathall",minutes:95,colors:{border:2,bg:0,text:10}},3:{name:"BELOW",start:"cellar",minutes:70,colors:{border:11,bg:0,text:12}},4:{name:"THE GROUNDS",start:"chapel",minutes:90,colors:{border:6,bg:0,text:14}}},midnight:'The great clock strikes TWELVE. Every candle in the castle gutters at once. Before you can move, cold grey hands close on your shoulders - Mortimer. "The master does not like his guests wandering at this hour, sir," he murmurs, and carries you back up through the dark... When you open your eyes, the clock has been wound back, as if the night were starting over. It is a game, after all.',clockWarn:{15:"Far above, the great clock chimes the three-quarter hour. A quarter to midnight.",5:"The clock chimes again - five minutes to midnight. Somewhere below, wood creaks, as if a lid is lifting."},chase:{caught:'A cold hand closes on the back of your neck. You are lifted off your feet as if you weighed nothing. "Running, Mr Grey?" the Count purrs in your ear. "After I was such a good host?" Then his teeth.',near:{5:"Behind you, far off, a door bursts from its hinges.",4:"You hear him: footsteps, unhurried, impossibly fast.",3:"A cold wind at your back. He's coming.",2:"A shadow flickers at the edge of your candlelight. He's close!",1:"He is RIGHT BEHIND YOU! You can hear him breathing - though he never breathes!"},stunned:"He's held back... for now."},rooms:{bedroom:{name:"Guest Bedroom",floor:1,desc:[{if:"flag:hatch_open",text:"A cold, high-ceilinged room. The four-poster BED is hung with faded velvet. The rug is pulled back from an open HATCH in the floor, leading DOWN. Moonlight falls thro n the chase - but every action costs time when he's behind you."},{text:"Drive FORWARD to the gatehouse."}]},gatehouse:{name:"Gatehouse",floor:4,desc:[{if:"flag:portcullis_up",text:"The gatehouse arch. The PORTCULLIS is raised, and through it the road winds down the mountain into the dark. FORWARD to the road. The courtyard is BACK."},{text:"The gatehouse arch. An iron PORTCULLIS bars the way, its chain wound round a great WINCH and locked with a PADLOCK. Beyond it, the road winds away down the mountain. The courtyard is BACK."}],exits:{back:"courtyard",forward:{to:"road",if:"flag:portcullis_up",no:"The portcullis is down."}},items:["portcullis","winch","padlock"],pic:[["grad",0,6,0,100],["stars",1,100,40,0,0,160,95],["stars",15,80,15,0,0,160,95],["circ",15,80,20,7],["circ",1,79,19,5],["rect",11,0,0,44,100],["rect",11,116,0,44,100],["rect",11,0,0,160,14],["dither",0,0,0,160,100],["oval",11,80,14,36,10],["poly",9,60,100,100,100,88,50,72,50],{if:"!flag:portcullis_up",ops:[["line",0,48,14,48,86],["line",0,56,14,56,86],["line",0,64,14,64,86],["line",0,72,14,72,86],["line",0,80,14,80,86],["line",0,88,14,88,86],["line",0,96,14,96,86],["line",0,104,14,104,86],["line",0,112,14,112,86],["line",0,44,24,116,24],["line",0,44,36,116,36],["line",0,44,48,116,48],["line",0,44,60,116,60],["line",0,44,72,116,72],["line",0,44,84,116,84]]},{if:"flag:portcullis_up",ops:[["line",0,48,0,48,12],["line",0,56,0,56,12],["line",0,64,0,64,12],["line",0,72,0,72,12],["line",0,80,0,80,12],["line",0,88,0,88,12],["line",0,96,0,96,12],["line",0,104,0,104,12],["line",0,112,0,112,12]]},["oval",9,22,70,10,10],["ring",12,22,70,10,10],["line",12,22,60,22,80],["line",12,12,70,32,70],["line",12,22,60,50,20],{if:"!flag:padlock_open",ops:[["rect",7,30,66,4,5]]}],hint:[{if:"!flag:padlock_open",text:"UNLOCK the PADLOCK with the Count's keys."},{if:"!flag:portcullis_up",text:"TURN the WINCH."},{text:"Drive FORWARD."}]},road:{name:"Village Road",floor:4,desc:[{if:"flag:villagers_parted",text:"The mountain road. The villagers have parted, torches high, staring past you at the castle. The road runs FORWARD, down towards dawn."},{text:'The mountain road, just beyond the gate. A crowd of VILLAGERS blocks it - farmers with pitchforks and blazing torches, faces hard with fear. "Another one from the castle!" someone shouts. "Back, devil!" They will not let you pass.'}],exits:{back:"gatehouse",forward:{to:"road",if:"flag:villagers_parted",no:'The villagers lower their pitchforks at you. "Not one step further, creature of the night!"'}},items:["villagers"],pic:[["grad",0,6,0,56],["stars",1,140,40,0,0,160,51],["stars",15,130,15,0,0,160,51],["circ",15,130,10,7],["circ",1,129,9,5],["poly",0,0,56,50,44,110,50,159,42,159,56],["rect",4,0,56,160,44],["dither",11,0,56,160,44],["poly",9,60,100,100,100,86,56,74,56],["dither",8,60,70,40,30],{if:"!flag:villagers_parted",ops:[["sprite",30,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",50,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",70,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",90,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",110,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."]]},{if:"flag:villagers_parted",ops:[["sprite",6,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",22,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",124,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."],["sprite",140,54,2,"..8..",".878.","..9.a",".aaa.",".a9a.","99999","99999",".9.9.",".9.9.",".0.0."]]}],hint:"SHOW the MIRROR SHARD to the villagers - prove you have a reflection."},wolfwood:{name:"Edge of the Wolf Wood",floor:4,desc:"Beyond a gap in the graveyard wall, the trees begin: black firs, close as prison bars. Between them, low to the ground, many pairs of yellow eyes are watching you. The wood lies FORWARD. The graveyard is BACK.",exits:{back:"graveyard",forward:{to:"wolfwood",if:"flag:never",die:"You step between the trees. The eyes move together, all at once, and then there is only snarling, and the dark."}},items:[],pic:[["grad",0,6,0,40],["stars",1,30,40,0,0,160,35],["stars",15,20,15,0,0,160,35],["circ",15,20,10,7],["circ",1,19,9,5],["rect",4,0,80,160,20],["dither",11,0,80,160,20],["poly",0,0,82,10,30,20,82],["poly",0,16,82,26,30,36,82],["poly",0,32,82,42,30,52,82],["poly",0,48,82,58,30,68,82],["poly",0,64,82,74,30,84,82],["poly",0,80,82,90,30,100,82],["poly",0,96,82,106,30,116,82],["poly",0,112,82,122,30,132,82],["poly",0,128,82,138,30,148,82],["poly",0,144,82,154,30,164,82],["plot",7,20,70,23,70],["plot",7,52,64,55,64],["plot",7,84,72,87,72],["plot",7,110,66,113,66],["plot",7,136,74,139,74],["plot",7,64,76,67,76]],hint:"There is nothing for you in the wood. Nothing but teeth.",listen:"Panting. All around you. Closer."}},items:{bed:{name:"bed",words:["bed","four poster","four-poster","velvet","pillow","mattress"],desc:"A four-poster bed with faded velvet hangings. Something pale shows beneath it.",scenery:!0},rug:{name:"rug",words:["rug","carpet","mat"],desc:[{if:"flag:rug_moved",text:"The rug lies rolled back against the wall."},{text:"A threadbare rug. One corner doesn't lie quite flat."}],scenery:!0},hatch:{name:"hatch",words:["hatch","trapdoor","trap door","panel"],desc:[{if:"flag:hatch_open",text:"A square hatch, open onto a dark, narrow crawlspace."},{text:"A square wooden hatch set into the floor, with an iron ring."}],scenery:!0,hidden:!0},bdoor:{name:"door",words:["door","lock","keyhole"],desc:"Solid oak, iron-banded. Locked from the outside. Through the keyhole you can see a long gallery... and the key, still in the lock on the other side.",scenery:!0},bwindow:{name:"window",words:["window","bars","moonlight","moon"],desc:"Iron bars, set deep in stone. Far below, a moonlit courtyard and the dark line of a road. You could not squeeze a hand through.",scenery:!0},letter:{name:"letter",words:["letter","note","envelope","paper"],desc:"A letter, folded small, the paper yellowed. READ it.",hidden:!0,read:"'To whoever wakes in this room: My name is Ivan Petrov. I came to sell the Count a house, as you did. The papers we sign are not a sale. They are a DEED that binds us to this castle. He has torn it into SEVEN pieces and hidden them, for sport. Find every piece and burn them on holy ground, or you will never leave. He rises at midnight. Beware the Countess. The eyes in the gallery see what they guard. And the moon shows what ink hides. - I.P.'"},deed1:{name:"deed piece I",words:["piece","deed","paper","deed piece","fragment","scrap","piece i"],desc:"A torn scrap of heavy parchment, edged with brown. Your own signature runs across it.",part:!0,points:50,found:"On the back, in faint pencil: 'He walled me up for loving her. - I.' The handwriting matches the letter.",hidden:!0},nest:{name:"rat's nest",words:["nest","rats nest","rat","rats","straw","corner"],desc:"A nest of straw, rags and gnawed paper. Something heavier than paper is tucked inside.",scenery:!0},cpanel:{name:"panel",words:["panel","light","wall"],desc:[{if:"flag:panel_open",text:"The panel has swung open into the gallery."},{text:"A wooden panel, loose on its hinges. You could PUSH it."}],scenery:!0},doll:{name:"porcelain doll",words:["doll","porcelain doll","dolly","toy"],desc:"A porcelain doll in a red dress. One glass eye, one painted. A label on its wrist reads: 'GERTIE'S'.",collect:"curio",pic:[["sprite",110,80,1,"..aa..",".a7aa.",".f0f0.",".ffff.","..22..",".2222.","f2222f",".2..2."]]},portrait:{name:"portrait",words:["portrait","painting","grimsby","lord grimsby","picture","frame","portraits","faces"],desc:"LORD GRIMSBY, 1712. A thin man in black, one hand on a skull. His painted eyes follow you along the gallery.",scenery:!0},eyes:{name:"eyes",words:["eyes","eye"],desc:"Painted eyes. They move. Not towards you - away, to the second SCONCE on the wall. Then back. Then away again.",scenery:!0},sconce:{name:"sconce",words:["sconce","sconces","candle holder","bracket"],desc:[{if:"flag:niche_open",text:"The second sconce hangs crooked, turned on its pivot."},{text:"Iron sconces holding guttering candles. The second one is slightly loose."}],scenery:!0},gdoor:{name:"guest room door",words:["door","lock","guest room","bedroom"],desc:[{if:"flag:door_open",text:"The guest room door, unlocked."},{text:"The guest room door. The iron key is still in the lock on this side."}],scenery:!0},niche:{name:"niche",words:["niche","hole","recess"],desc:"A small niche behind the sconce, lined with velvet.",scenery:!0,hidden:!0},smallkey:{name:"small brass key",words:["key","small key","brass key","small brass key"],desc:"A small, delicate brass key - the sort for a cabinet, not a door.",hidden:!0},eyering:{name:"eyeball ring",words:["ring","eyeball ring","eyeball","eye ring"],desc:"A heavy silver ring set with a glass eye. You could swear it blinked.",collect:"curio",hidden:!0},vampira:{name:"Countess",words:["countess","vampira","woman","lady","vampire","sister"],desc:[{if:"flag:music_playing",text:"Her eyes are closed. A single red tear runs down her white cheek."},{text:"Pale, beautiful and utterly still. Black hair, a dress the colour of a bruise. When she turns her head, you see her teeth."}],npc:!0,scenery:!0,talk:[{if:"flag:music_playing",text:'Without opening her eyes: "This was our song. Mine and Ivan\'s. My brother told me he left for England without a word." Her voice cracks. "Take what you came for. Leave me with it."'},{text:'She does not turn. "Another guest. How tedious." Her voice is very soft. "Leave, little clerk. Unless you can make that gramophone sing. It has been silent since he went away."'}],refuse:"She doesn't even look at it.",pic:[["sprite",102,24,2,"...0000...","..000000..",".00ffff00.",".0f0ff0f0.",".0ffffff0.",".00f22f00.","..0ffff0..","...0ff0...","..444444..",".44444444.",".4f4444f4.",".4f4444f4.","..444444..","..444444..",".44444444.",".44444444.","4444444444","4444444444"]]},gramophone:{name:"gramophone",words:["gramophone","horn","player","needle","phonograph"],desc:[{if:"flag:music_playing",text:"A waltz turns slowly on the platter."},{text:"A brass gramophone. The needle hisses in an empty groove. There's no record on it."}],scenery:!0},vmirror:{name:"mirror",words:["mirror","dressing table","table","reflection"],desc:"The mirror shows the room, the gramophone, the dried roses... and an empty chair. The Countess is not in it.",scenery:!0},ironkey:{name:"iron key",words:["key","iron key","black key","stair key"],desc:"A long black iron key. A tag reads 'STAIR GATE'.",scenery:!0,pic:[["rect",0,110,45,8,1],["plot",0,118,46]]},cabinet:{name:"glass cabinet",words:["cabinet","case","glass","glass cabinet"],desc:[{if:"flag:cabinet_open",text:"The cabinet stands open."},{text:"A glass-fronted cabinet, locked. Inside lies a single gramophone record in a plain sleeve."}],scenery:!0},bookcase:{name:"bookcase",words:["bookcase","shelves","books","shelf"],desc:[{if:"flag:bookcase_open",text:"The bookcase has swung outward, revealing a narrow nook behind it. FORWARD."},{text:"Floor-to-ceiling books. One red spine juts out further than the rest."}],scenery:!0},redbook:{name:"red book",words:["red book","red","book","spine"],desc:"A red leather spine with no title. It doesn't feel like a book. It feels like a handle.",scenery:!0},record:{name:"gramophone record",words:["record","disc","sleeve","song","music"],desc:"A heavy shellac record in a plain sleeve. Written on it in faded ink: 'For V. - with all my heart, I.'",hidden:!0},deed2:{name:"deed piece II",words:["piece","deed","paper","deed piece","fragment","scrap","piece ii"],desc:"A second strip of the deed. The ink of your signature has bled into it like a stain.",part:!0,points:50,found:"Tucked in the record sleeve with it, a few lines: 'Our song, V. If he finds this, he will wall me up as he swore he would. - I.'"},jpage:{name:"journal page",words:["page","journal page","journal","note","pin"],desc:"A page torn from a journal, pinned to the wall. READ it.",scenery:!0,read:"'If ever he wakes while you are near - DO NOT WALK. RUN. He is faster than any man, but slower than fear. RUN FORWARD, RUN LEFT, RUN anywhere - only run. And hang garlic where he must follow. - I.P.'"},deed3:{name:"deed piece III",words:["piece","deed","paper","deed piece","fragment","scrap","piece iii"],desc:"A third piece of the deed, damp and a little chewed at the corner.",part:!0,points:50,found:"Scratched on the back with a pin: 'The Count sleeps with the last piece in his hands. Garlic, or he wakes.'"},bell:{name:"bell",words:["bell","rope","bronze bell"],desc:"A great bronze bell, green with age. The rope hangs within reach. Ringing it would wake the dead. Possibly literally.",scenery:!0},clockwork:{name:"clockwork",words:["clockwork","clock","gears","pendulum","mechanism"],desc:"The castle clock: iron wheels and a pendulum as long as a man. It is {time}.",scenery:!0},flit:{name:"bat",words:["bat","flit","little bat","small bat"],desc:[{if:"flag:flit_friend",text:"FLIT, the little bat, hangs upside down beside you, watching you with bright red eyes."},{text:"A small bat with a torn wing, alone on the ledge. It watches the moths around your candle with longing."}],npc:!0,scenery:!0,talk:[{if:"flag:flit_friend",text:"Flit squeaks and flutters around your head once, then settles."},{text:"The bat cocks its head. It's too hungry to listen."}],refuse:"The bat sniffs it and turns away.",pic:[["sprite",120,50,1,"00.........00","000..0.0..000","0000.000.0000",".00000200000.","..000000000..","....0...0...."]]},gargoyle:{name:"gargoyle",words:["gargoyle","ledge","window","statue"],desc:[{if:"flag:flit_friend",text:"A grinning stone gargoyle."},{text:"A stone gargoyle beyond the window. A scrap of parchment is caught in its claws, flapping in the wind. Too far to reach."}],scenery:!0},moths:{name:"moths",words:["moth","moths","insects"],desc:[{if:"lit",text:"Pale moths spiral around your candle flame."},{text:"In the dark you can hear wings - moths, perhaps, waiting for a light."}],scenery:!0},moth:{name:"moth",words:["moth","pale moth"],desc:"A pale, dusty moth, fluttering in your cupped hands."},whistle:{name:"silver whistle",words:["whistle","silver whistle","bat whistle"],desc:"A tiny silver whistle, shaped like a bat. It makes a sound too high for human ears.",pic:[["rect",15,44,84,6,2],["plot",15,50,85]]},gertie:{name:"Gertie",words:["gertie","girl","child","niece"],desc:"A little girl, pale as candle wax, in a black dress with a white collar. She does not blink. Ever.",npc:!0,scenery:!0,talk:[{if:"flag:gertie_told",text:'"Left, then right, in the hedges," she whispers. "And don\'t wake Great-Grandpapa. He\'s ever so cross."'},{text:'"You\'re the new one," Gertie says, without looking up. "They always try the front door first." She strokes a jar of spiders. "Someone took my dolly. Bring her back and I\'ll tell you a secret."'}],refuse:'"That\'s not my dolly."',pic:[["sprite",66,38,2,"..0....0..",".00000000.",".0ffffff0.","0.f0ff0f.0","0.ffffff.0","..ff22ff..","...ffff...","..000000..",".00000000.",".f000000f.",".f000000f.","..000000..","..f....f..","..0....0.."]]},jars:{name:"jars",words:["jars","jar","spiders","spider"],desc:"Dozens of jars, each holding one fat black spider. Each jar has a name on it. One says 'IVAN'S'.",scenery:!0},dolls:{name:"dolls",words:["dolls","shelves","toys"],desc:"Porcelain dolls in rows. Every one of them is facing you. You're sure they were facing the door a moment ago. There's an empty space on the top shelf.",scenery:!0},stairgate:{name:"stair gate",words:["gate","stair gate","iron gate","bars","padlock","lock"],desc:[{if:"flag:gate_open",text:"The stair gate stands open."},{text:"Black iron bars and a heavy lock. A tag beside it reads 'KEY - COUNTESS'."}],scenery:!0},newel:{name:"newel post",words:["newel","newel post","post","bannister","banister","bat","carved bat","rail"],desc:[{if:"flag:study_open",text:"The carved bat on the newel post has been turned to face the wall."},{text:"The end of the bannister: a thick oak post topped with a carved bat, wings folded. Its wood is worn smooth, as if often handled."}],scenery:!0},clank:{name:"suit of armour",words:["armour","armor","sir clank","clank","knight","visor","halberd"],desc:"A full suit of black armour holding a halberd. The brass plate reads SIR CLANK. When you're not looking, you're sure it turns its head.",scenery:!0,npc:!0,talk:"The armour says nothing. But the halberd shifts, very slightly, in its gauntlet.",refuse:"The gauntlet does not open."},frontdoors:{name:"front doors",words:["doors","front doors","front door","door","threshold","exit"],desc:"Two great doors of black oak, unlocked and half open on the night. The way out. But when you try to step through, your body simply will not obey.",scenery:!0},fireplace:{name:"fireplace",words:["fire","fireplace","hearth","flames"],desc:"Flames as tall as a man, and yet frost glitters on the stones around the hearth.",scenery:!0},desk:{name:"desk",words:["desk","writing desk","drawers"],desc:"Letters in a spiky hand, all addressed to London estate agents. The Count has been buying houses. Many houses.",scenery:!0},candlestick:{name:"candlestick",words:["candlestick","candle stick","brass candlestick"],desc:"A heavy brass candlestick, fixed to the desk. It doesn't lift. It tilts.",scenery:!0},safe:{name:"safe",words:["safe","dial","keypad","strongbox"],desc:[{if:"flag:safe_open",text:"The safe stands open."},{text:"An iron safe set into the wall, with four brass number wheels. TYPE a 4-digit code."}],scenery:!0,hidden:!0},maps:{name:"maps",words:["maps","map","london","houses","portrait","count"],desc:"Maps of London. Piccadilly, Mile End, Purfleet - fifty houses circled in red. The portrait shows the Count, painted from memory: no artist could ever have seen his reflection.",scenery:!0},ledger:{name:"guest ledger",words:["ledger","book","list","guests"],desc:"A black ledger. READ it.",hidden:!0,read:"A list of guests, going back two hundred years. Each name has been crossed out. The last two are: 'IVAN PETROV, 1891' - crossed out. And, in fresh ink: 'JONATHAN GREY, 1897'. Not crossed out. Not yet."},paw:{name:"monkey's paw",words:["paw","monkeys paw","monkey paw","hand"],desc:"A shrivelled monkey's paw on a cord. Three of its fingers are curled. You decide not to make a wish.",collect:"curio",pic:[["rect",9,52,50,4,2],["plot",9,56,49,57,50]]},deed4:{name:"deed piece IV",words:["piece","deed","paper","deed piece","fragment","scrap","piece iv"],desc:"A fourth piece of the deed, sealed with black wax.",part:!0,points:50,found:"On the back, the Count's own spiky hand: 'Our dear Ivan rests within the cellar wall. He sings to the rats.'",hidden:!0},feast:{name:"feast",words:["feast","food","table","boar","tureens","wine","dinner"],desc:"A feast for twenty. Nobody has eaten it in a hundred years. It is still steaming.",scenery:!0},mortimer:{name:"butler",words:["butler","mortimer","servant","man"],desc:"A tall, stooped butler with grey skin and black, patient eyes. His gloves are spotless.",npc:!0,scenery:!0,talk:[{if:"!flag:study_open",text:'"Good evening, Mr Grey." His voice is like a closing door. "The master\'s study? I couldn\'t say, sir. Though I do find myself polishing the bat on the newel post rather often."'},{if:"!has:cellarkey",text:'"The cellar key, sir? The master keeps it where he never looks. Among the mirrors." He pauses. "The plant in the conservatory is partial to refreshments from the icebox."'},{text:'"The master rises at midnight, sir. I would not be found wandering at that hour." A pause. "The young lady in the nursery enjoys a gift. And the mare in the stables is fond of oats."'}],refuse:'"Most kind, sir. But no."'},steak:{name:"wooden steak",words:["steak","wooden steak","meat","plate"],desc:"A steak, on a silver plate. Carved, very lifelike, out of wood. Someone in this house has a sense of humour after all.",pic:[["oval",9,70,66,5,2],["plot",8,69,65]]},teacup:{name:"bottomless teacup",words:["teacup","cup","tea cup","bottomless teacup"],desc:"A fine china teacup. When you look into it, you cannot see the bottom. Just a long way down.",collect:"curio",pic:[["rect",15,104,60,4,3],["plot",15,108,61]]},garlic:{name:[{if:"flag:garlic_worn",text:"garlic braid (worn)"},{text:"garlic braid"}],words:["garlic","braid","garlic braid","cloves"],desc:"A braid of garlic bulbs, pungent enough to make your eyes water. You could WEAR it.",wearable:!0,pic:[["plot",15,66,12,66,14,67,16,66,18]]},icebox:{name:"icebox",words:["icebox","ice box","fridge","refrigerator","cupboard"],desc:[{if:"flag:icebox_open",text:"Racks of corked bottles, dark red, labelled by year. 1756 was evidently a good one."},{text:"A great zinc-lined icebox. Frost seeps from under its door."}],scenery:!0},bottle:{name:"bottle of blood",words:["bottle","blood","bottle of blood","vintage"],desc:"A corked bottle of something thick and dark red. The label says '1756'.",hidden:!0},stake:{name:"wooden stake",words:["stake","wooden stake","chair leg"],desc:"A chair leg, whittled to a vicious point. Someone has been preparing.",pic:[["line",9,24,62,40,60],["plot",15,41,60]]},cellardoor:{name:"cellar door",words:["door","cellar door","cellar","lock"],desc:[{if:"flag:cellar_open",text:"The cellar door stands open."},{text:"A heavy door of black oak with a large iron lock."}],scenery:!0},plant:{name:"Snapdragon",words:["plant","snapdragon","jaws","vine","flower","flytrap"],desc:[{if:"flag:plant_fed",text:"Gorged and drowsy. It burps, faintly."},{text:"A plant the size of a horse, with a head like a bear trap lined with thorns. It sways towards your warmth."}],npc:!0,scenery:!0,talk:"Snapdragon's jaws open a fraction. It is not listening. It is smelling.",refuse:"Snapdragon snaps at it, then loses interest. It wants something... richer."},deed5:{name:"deed piece V",words:["piece","deed","paper","deed piece","fragment","scrap","piece v"],desc:"A fifth piece, slightly sticky. You try not to think about it.",part:!0,points:50,found:"On the back, in a child's careful letters: 'GREAT-UNCLE HIDES THE LAST ONE IN HIS HANDS. - G.'",scenery:!0},organ:{name:"pipe organ",words:["organ","pipe organ","pipes","keys","keyboard"],desc:"A pipe organ, its keys yellow as old teeth. A sheet of music on the stand is titled 'For the Bride'.",scenery:!0},mwindow:{name:"moonlight",words:["window","moonlight","moon","light","shaft"],desc:"Silver moonlight floods through the tall window in a sharp-edged shaft.",scenery:!0},harp:{name:"harp",words:["harp","strings"],desc:"A golden harp. Every string has been cut.",scenery:!0},bigmirror:{name:"great mirror",words:["mirror","great mirror","black mirror","magic mirror","frame"],desc:"A tall mirror in a black frame. Your reflection looks back - but in the reflected corridor, something hangs on a hook by the door that isn't there in the real one.",scenery:!0},cracked:{name:"cracked mirror",words:["cracked","cracked mirror","small mirror","mirrors"],desc:"A small mirror with a crack across one corner. A sliver of glass is loose.",scenery:!0},shard:{name:"mirror shard",words:["shard","glass","mirror shard","sliver"],desc:"A sliver of silvered glass. It shows your face: human, reflected, alive. That might matter to someone.",pic:[["poly",15,30,34,34,32,32,40]]},cellarkey:{name:"cellar key",words:["key","cellar key","hook"],desc:"A heavy iron key, cold as the grave. The bow is shaped like a wine barrel.",hidden:!0},racks:{name:"wine racks",words:["racks","rack","bottles","wine racks"],desc:"Bottles furred with dust, from vintages long forgotten. Most are wine. Most.",scenery:!0},cwall:{name:"wall",words:["wall","bricks","brick","far wall","knocking","hole"],desc:[{if:"flag:wall_open",text:"A ragged hole in the brickwork."},{text:"The brickwork here is newer than the rest, and the mortar is crumbling. The knocking comes from right behind it."}],scenery:!0},wine:{name:"bottle of wine",words:["wine","bottle of wine","red wine"],desc:"A dusty bottle of red wine. Real wine. You checked."},ivan:{name:"Ivan",words:["ivan","man","prisoner","petrov","ivan petrov"],desc:"Ivan Petrov: hollow-cheeked, bearded, chained to the wall. Six years in the dark, and still alive. Just.",npc:!0,scenery:!0,hidden:!0,talk:[{if:"flag:ivan_freed",text:'"The Count lies past the crypt with the last piece in his hands. Wear garlic and he will not wake. Ready the carriage before you burn the deed - oats for the mare, and the linchpin is in the courtyard well. When the deed burns, he WAKES. Do not walk. RUN."'},{text:"Ivan's lips move, but no sound comes. He's too weak to speak. He needs something to drink."}],refuse:"Ivan shakes his head weakly.",pic:[["rect",0,64,34,30,30],["sprite",70,40,2,"..9999..",".999999.",".9aaaa9.",".a0aa0a.",".aaaaaa.",".a9999a.","..9999..",".8a88a8.","88888888","88888888"]]},chains:{name:"chains",words:["chains","chain","tally","marks","scratches"],desc:"Tally marks, thousands of them, in groups of five. Some guest counted a very long time.",scenery:!0},crowbar:{name:"crowbar",words:["crowbar","bar","iron bar","jemmy"],desc:"A rusted iron crowbar. Heavy, and very satisfying to hold.",pic:[["line",12,40,92,60,88],["plot",12,61,87,61,89]]},head:{name:"shrunken head",words:["head","shrunken head","skull"],desc:"A shrunken head the size of an apple, its lips sewn shut. You could swear it's trying to whistle.",collect:"curio",pic:[["oval",9,120,48,3,3],["plot",0,119,47,121,47]]},coffins:{name:"coffins",words:["coffins","coffin","names","crests"],desc:"Generations of Draculas. Every lid is closed. You'd like to keep it that way.",scenery:!0},vladtomb:{name:"great tomb",words:["tomb","vlad","great tomb","grandpapa","great grandpapa","elder"],desc:"A massive tomb of black marble. The lid is very slightly ajar, and the stone around it is scored with fingernail marks. From the inside.",scenery:!0},count:{name:"Count",words:["count","dracula","count dracula","vampire","body","hands","face"],desc:"Count Dracula. Long white face, hooked nose, red lips. His nails are long and his folded hands are very white. He is not breathing. He is only waiting.",npc:!0,scenery:!0,talk:"You open your mouth to speak, and think better of it.",refuse:"You are not going to touch his hands. Not like that."},coffin:{name:"coffin",words:["coffin","lid","dais","box"],desc:"A coffin of black lacquer lined with red silk, filled with dark earth.",scenery:!0},earth:{name:"earth",words:["earth","dirt","soil","sacred dirt","sacred earth","homeland earth"],desc:[{if:"flag:earth_scattered",text:"Most of the earth is gone from the coffin's foot."},{text:"Earth from his homeland. He must rest on it, the old stories say, or he cannot rest at all."}],scenery:!0},deed6:{name:"deed piece VI",words:["piece","deed","paper","deed piece","fragment","scrap","piece vi"],desc:"The sixth piece. It's cold, and smells of grave-earth.",part:!0,points:50,found:"On the back, in the Count's spiky hand: 'Only the chapel. Only holy fire. You will never reach it, little clerk.'",scenery:!0},countkeys:{name:"ring of keys",words:["keys","ring","key ring","ring of keys","iron keys"],desc:"An iron ring of old keys. One is tagged 'GATE'.",scenery:!0},bones:{name:"bones",words:["bones","skulls","skull","bone"],desc:"Thousands of bones arranged in patterns: stars, crosses, bats. Someone had a great deal of time and a great many guests.",scenery:!0},trapdoor:{name:"trapdoor",words:["trapdoor","trap door","hatch","ceiling"],desc:[{if:"flag:trap_open",text:"Open. Moonlight and the smell of old incense."},{text:"A wooden trapdoor, swollen and jammed. You need leverage."}],scenery:!0},altar:{name:"altar",words:["altar","candles","inscription","carving","stone"],desc:"A stone altar, candles burning without guttering. The inscription reads: 'WHEN THE BOND IS BROKEN, THE MASTER WAKES. DO NOT WALK.' Below, scratched by another hand: 'RUN. - I.P.'",scenery:!0},holywater:{name:"holy water",words:["water","holy water","vial","font"],desc:"A small glass vial of holy water. It feels warm in your hand.",pic:[["rect",14,104,54,2,3],["plot",1,104,54]]},graves:{name:"gravestones",words:["gravestones","gravestone","stones","graves","headstones"],desc:"Names, worn smooth. Guests, every one of them. 'WALTER', 'MAUD', 'ERIC', 'IVAN PETROV' - the last one with an empty grave beside it.",scenery:!0},freshgrave:{name:"fresh grave",words:["fresh grave","grave","new grave","hole","freshly dug"],desc:"An open grave, freshly dug. A new headstone stands at its head. You could READ it.",scenery:!0},hedges:{name:"hedges",words:["hedges","hedge","yew","maze","paths"],desc:"Dense black yew. You could not push through it if you tried.",scenery:!0},fountain:{name:"fountain",words:["fountain","basin","water"],desc:"A dry stone basin, its bottom carpeted with dead leaves.",scenery:!0},angel:{name:"stone angel",words:["angel","statue","weeping angel"],desc:"A stone angel with its face in its hands. Between its fingers, you can see that its eyes are open.",scenery:!0},deed7:{name:"deed piece VII",words:["piece","deed","paper","deed piece","fragment","scrap","piece vii"],desc:"The seventh and last piece of the deed.",part:!0,points:50,found:"On the back, in Ivan's hand: 'Burn them all together, on the altar. And then - RUN.'",pic:[["rect",1,86,76,5,2]]},musicbox:{name:"music box",words:["box","music box","musicbox"],desc:"A tiny silver music box. Wound, it plays the same waltz as the Countess's record.",collect:"curio",pic:[["rect",15,66,76,6,3],["line",7,66,75,71,75]]},well:{name:"well",words:["well","stone well"],desc:"An old stone well. The bucket rope disappears into darkness. It feels heavy, as if something's in the bucket.",scenery:!0},bucket:{name:"bucket",words:["bucket","rope"],desc:"A wooden bucket on a rope.",scenery:!0},linchpin:{name:"linchpin",words:["linchpin","pin","wheel pin","iron pin"],desc:"A long iron linchpin - the pin that holds a carriage wheel on its axle.",hidden:!0},horse:{name:"Nightshade",words:["horse","mare","nightshade","black mare"],desc:[{if:"flag:horse_calm",text:"Nightshade, calm now, nuzzling your pocket for more oats."},{text:"A tall black mare, eyes rolling white. She won't let a stranger near her."}],npc:!0,scenery:!0,talk:[{if:"flag:horse_calm",text:"Nightshade blows warm breath on your face."},{text:"Nightshade snorts and backs away."}],refuse:"Nightshade tosses her head."},carriage:{name:"carriage",words:["carriage","coach","wheel","axle","reins"],desc:[{if:"flag:pin_fitted",text:"A black carriage, sound and ready."},{text:"A black carriage. The near wheel wobbles on its axle - the linchpin is missing."}],scenery:!0},oats:{name:"sack of oats",words:["oats","sack","sack of oats","feed"],desc:"A sack of oats."},portcullis:{name:"portcullis",words:["portcullis","gate","bars","grille"],desc:[{if:"flag:portcullis_up",text:"Raised, its spikes dripping."},{text:"An iron grille with spiked teeth, down and barring the way."}],scenery:!0},winch:{name:"winch",words:["winch","wheel","chain","crank","handle"],desc:[{if:"flag:padlock_open",text:"A great winch. You could TURN it."},{text:"A great winch, its chain locked with a padlock."}],scenery:!0},padlock:{name:"padlock",words:["padlock","lock"],desc:[{if:"flag:padlock_open",text:"The padlock hangs open."},{text:"A heavy padlock. It would take one of the Count's keys."}],scenery:!0},villagers:{name:"villagers",words:["villagers","crowd","farmers","people","mob","torches","pitchforks"],desc:"Frightened, angry people with torches and pitchforks. They've lost too many to that castle.",npc:!0,scenery:!0,talk:[{if:"flag:villagers_parted",text:'"Go, sir. Go, and don\'t look back."'},{text:'"Liars, all of you from up there!" they shout. "Show us you\'re human, if you\'re human!"'}],refuse:'"We want nothing from that cursed place!"'}},actions:[{verb:["look","examine"],noun:"bed",room:"bedroom",once:!0,do:[{say:"You kneel and look under the bed. Dust... and a LETTER, folded small, pushed far back against the wall."},{show:"letter"}]},{verb:"read",noun:"letter",once:!0,if:"!in:musicroom",do:[{set:"letter_read"},{say:"'To whoever wakes in this room: My name is Ivan Petrov. I came to sell the Count a house, as you did. The papers we sign are not a sale. They are a DEED that binds us to this castle. He has torn it into SEVEN pieces and hidden them, for sport. Find every piece and burn them on holy ground, or you will never leave. He rises at midnight. Beware the Countess. The eyes in the gallery see what they guard. And the moon shows what ink hides. - I.P.'"},{score:10}]},{verb:["pull","push","take","open","go"],noun:"rug",room:"bedroom",once:!0,do:[{set:"rug_moved"},{show:"hatch"},{say:"You drag the rug aside. Underneath, set into the boards, is a square HATCH with an iron ring."}]},{verb:["open","pull","take"],noun:"hatch",room:"bedroom",once:!0,do:[{set:"hatch_open"},{say:"You haul on the iron ring. The hatch comes up with a groan, breathing out cold, dusty air. A narrow crawlspace runs between the walls below."},{score:10}]},{verb:["open","push","pull","unlock","knock"],noun:"bdoor",do:[{say:"You rattle the door. It doesn't give. From somewhere far off, footsteps pause... then move away."}]},{verb:["examine","open","look"],noun:"nest",once:!0,do:[{say:"You pull the nest apart. Rags, bones, gnawed paper... and a folded piece of PARCHMENT."},{show:"deed1"}]},{verb:["push","open","pull","attack"],noun:"cpanel",once:!0,do:[{set:"panel_open"},{say:"You put your shoulder to the panel. It gives with a crack and swings open onto a long, candlelit gallery."},{score:10}]},{verb:["examine","look","peer"],noun:["portrait","eyes"],do:[{set:"eyes_seen"},{say:"Lord Grimsby's painted eyes slide away from you - towards the second SCONCE on the wall - then back. Then towards the sconce again. As if he wants you to look."}]},{verb:["use","pull","push","take"],noun:"sconce",once:!0,do:[{set:"niche_open"},{show:["niche","smallkey","eyering"]},{say:"You twist the sconce. It turns on a pivot, and a small stone slides back beneath it. In the niche behind: a SMALL BRASS KEY and a silver RING."},{score:10}]},{verb:["unlock","open","use"],noun:"gdoor",do:[{set:"door_open"},{say:"You turn the key. The guest room door unlocks."}]},{verb:["take"],noun:"ironkey",if:"!flag:music_playing",do:[{die:'You reach for the key. The Countess\'s hand closes around your wrist like iron - cold, impossibly strong. She smiles. "How rude," she whispers, and the room goes dark.'}]},{verb:["put","use","give"],noun:["record","gramophone","vampira"],room:"boudoir",if:"has:record",do:[{remove:"record"},{set:"music_playing"},{sound:"good"},{say:'You set the record on the platter and lower the needle. A crackle - then a slow, aching waltz fills the room. The Countess goes very still. Her eyes close. "Ivan," she breathes, and begins to sway.'},{score:20}]},{verb:["use","push"],noun:"gramophone",if:"!flag:music_playing",do:[{say:"There's no record on it. It needs music."}]},{verb:["attack","touch"],noun:"vampira",do:[{die:"She turns. You see her eyes, and then you see nothing at all."}]},{verb:["unlock","open"],noun:["cabinet","smallkey"],room:"library",if:["has:smallkey","!flag:cabinet_open"],fail:"It's locked. You need a small key.",do:[{set:"cabinet_open"},{give:["record","deed2"]},{say:"The small key turns. The glass door swings open. You lift out the record - and a folded piece of PARCHMENT slips from the sleeve into your hand."}]},{verb:["pull","push","take","open"],noun:["redbook","bookcase"],room:"library",once:!0,do:[{set:"bookcase_open"},{say:"You pull the red book. Something clicks deep in the wall, and the whole bookcase swings outward on silent hinges. There is a narrow NOOK behind it, FORWARD."},{score:10}]},{verb:"take",noun:["moths","moth"],room:"belfry",if:["lit","!has:moth","!flag:flit_friend"],do:[{give:"moth"},{say:"You cup your hands around the candle flame and wait. A pale MOTH blunders into your fingers."}]},{verb:"take",noun:["moths","moth"],room:"belfry",if:"!lit",do:[{say:"There's nothing to catch. Moths only come to light."}]},{verb:["examine","look"],noun:"flit",if:["lit","!flag:flit_friend"],do:[{say:"A small bat with a torn wing. It's watching the moths circling your candle very, very hungrily."}]},{verb:["give","throw"],noun:["moth","flit"],if:"has:moth",do:[{remove:"moth"},{set:"flit_friend"},{sound:"good"},{say:"The bat snatches the moth from your fingers and gulps it down. It squeaks, then launches itself through the window, wobbles out to the gargoyle - and comes back with the scrap of PARCHMENT in its teeth. It drops it into your hand and settles on your shoulder for a moment. You decide to call it FLIT."},{give:"deed3"},{score:15}]},{verb:["take","climb","jump"],noun:["gargoyle","deed3"],room:"belfry",do:[{die:"You lean out of the window and stretch for the gargoyle. Your fingers brush the paper. Then the stone ledge crumbles under your elbow..."}]},{verb:["push","pull","use","knock"],noun:"bell",do:[{clock:-10},{sound:"chime"},{say:"BONGGG! The bell swings and the whole tower shudders. Every bat in the belfry erupts in a shrieking cloud. Somewhere far below, a door opens, and slow footsteps begin to climb. You hide in the shadows until they go away again. You have lost precious minutes. It is now {time}."}]},{verb:["use","blow"],noun:"whistle",if:"flag:flit_friend",do:[{say:"You blow the whistle. You hear nothing, but Flit comes swooping in from nowhere, circles your head twice and vanishes again."}]},{verb:"give",noun:"doll",if:"here:gertie",do:[{remove:"doll"},{set:"gertie_told"},{say:'Gertie snatches the doll and hugs it fiercely. Then she beckons, and whispers in your ear, her breath like frost: "Left, then right, in the hedges - that\'s how you find the middle. And the lady in the boudoir cries for the man in the wall." She smiles. Her teeth are very small and very sharp.'},{secret:"gertie"}]},{verb:["unlock","open"],noun:["stairgate","ironkey"],room:"landing",if:"has:ironkey",fail:"It's locked. The tag says the Countess has the key.",do:[{set:"gate_open"},{sound:"good"},{say:"The iron key turns with a scream of rust. The stair gate swings open."},{score:15}]},{verb:"take",noun:"ironkey",if:["flag:music_playing","here:ironkey"],do:[{give:"ironkey"},{say:"Moving very slowly, you lift the iron key from the dressing table. The Countess sways on, lost in the music."}]},{verb:["push","pull","use","open"],noun:"newel",once:!0,do:[{set:"study_open"},{sound:"good"},{say:"You grip the carved bat and twist. It turns with a click. Beneath the stairs, a section of panelling swings inward onto a short flight of steps, going DOWN."},{score:15}]},{verb:["open","examine","look","peer"],noun:"clank",if:"!flag:clank_seen",do:[{say:"You lift Sir Clank's visor. Inside: darkness, and two points of red light that blink once, slowly. You lower the visor again. Carefully."},{secret:"clank"}]},{verb:["pull","push","use"],noun:"candlestick",once:!0,do:[{set:"safe_found"},{show:"safe"},{say:"You tilt the candlestick. A map of London slides aside, revealing an iron SAFE with four brass number wheels."},{score:10}]},{verb:"type",noun:"1897",room:"study",if:["flag:safe_found","!flag:safe_open"],do:[{set:"safe_open"},{show:["deed4","ledger"]},{sound:"good"},{say:"The wheels click into place: 1-8-9-7. The safe door swings open. Inside: a PIECE of the deed and a black LEDGER."},{score:20}]},{verb:"type",noun:"*",room:"study",if:"flag:safe_found",do:[{say:"The wheels turn, but the safe stays shut."},{sound:"bad"}]},{verb:"read",noun:"letter",room:"musicroom",do:[{set:"code_seen"},{say:"You hold the letter up in the shaft of moonlight. Between the lines, faint brown letters appear - written in lemon juice: 'HIS SAFE: 1897. THE YEAR HE WILL WRITE BESIDE YOUR NAME.'"},{score:15}]},{verb:["put","peer","use","show"],noun:"letter",room:"musicroom",do:[{command:"read letter"}]},{verb:["use","push","touch"],noun:"organ",do:[{say:"You press a single key. A low, enormous note rolls through the castle, and every candle flickers. Somewhere far above, someone begins to play the same note back on a piano. You stop."},{secret:"organ"}]},{verb:["peer","examine","look","use"],noun:"bigmirror",once:!0,do:[{set:"mirror_seen"},{show:"cellarkey"},{say:"You look deep into the great mirror. In the reflection, on a hook beside the doorway behind you, hangs a large iron KEY. You turn round. The hook is empty. You look back at the mirror. The key is there. Perhaps you need to reach for it without looking."}]},{verb:"talk",noun:"bigmirror",do:[{say:'The great mirror\'s surface ripples. A voice like frost on glass: "What has no reflection, no breath and no heartbeat, yet dines every night? Do not be here when he sits down to eat." The surface stills.'},{secret:"mirror"}]},{verb:["give","throw","use","pour","put"],noun:["bottle","plant"],room:"conservatory",if:["has:bottle","!flag:plant_fed"],do:[{remove:"bottle"},{set:"plant_fed"},{sound:"good"},{say:"You pull the cork and toss the bottle. Snapdragon's jaws snap shut on it with a crunch of glass. It drinks, shudders with pleasure, and slowly droops, heavy and drowsy, its jaws closing."},{score:15}]},{verb:["give","throw"],noun:"steak",room:"conservatory",if:"has:steak",do:[{remove:"steak"},{say:"You toss the wooden steak. Snapdragon catches it, chews thoughtfully... and spits it out across the glasshouse with real disgust. Fair."},{secret:"steak"}]},{verb:["take"],noun:"deed5",if:"!flag:plant_fed",do:[{die:"You reach for the paper on the bench. Snapdragon moves faster than anything that size should. The last thing you see is a ring of thorns closing over you."}]},{verb:["open"],noun:"icebox",once:!0,do:[{set:"icebox_open"},{show:"bottle"},{say:"You heave the icebox open. A breath of frost - and rows of corked bottles, dark red, labelled by year."}]},{verb:"eat",noun:"steak",do:[{say:"It's made of wood. You'd break a tooth."}]},{verb:"wear",noun:"garlic",if:["has:garlic","!flag:garlic_worn"],do:[{set:"garlic_worn"},{say:"You loop the garlic braid around your neck. The smell is appalling. Good."}]},{verb:"wear",noun:"garlic",if:"flag:garlic_worn",do:[{say:"You're already wearing it. Everyone can tell."}]},{verb:["unlock","open"],noun:["cellardoor","cellarkey"],room:"kitchen",if:["has:cellarkey","!flag:cellar_open"],fail:"It's locked. Mortimer said the key is among the mirrors.",do:[{set:"cellar_open"},{say:"The iron key turns heavily. The cellar door opens on stone steps leading DOWN into cold darkness. A smell of earth and old wine rises to meet you."},{score:15}]},{verb:"take",noun:"deed5",if:["flag:plant_fed","here:deed5"],do:[{give:"deed5"},{say:"You ease the paper from the bench. Snapdragon gurgles in its sleep, but does not stir."}]},{verb:"knock",noun:["cwall",""],room:"cellar",if:"!flag:wall_open",do:[{say:'You rap on the bricks: knock, knock, knock. The knocking on the other side stops. Then a voice - faint, cracked, human: "...Is someone there? Please..."'}]},{verb:["use","open","pull","push","attack","fix"],noun:["cwall","crowbar"],room:"cellar",if:["has:crowbar","!flag:wall_open"],fail:"The bricks are loose, but you can't pull them out with your bare hands. You need something to pry with.",do:[{set:"wall_open"},{show:"ivan"},{sound:"good"},{say:"You jam the crowbar into the crumbling mortar and heave. A brick comes loose, then another, then a whole section crashes inward. In the cavity behind, chained to the wall, is a gaunt, bearded man. He lifts his head. His eyes are alive."},{score:20}]},{verb:["give","pour","use"],noun:["wine","ivan"],if:["has:wine","here:ivan","!flag:ivan_freed"],do:[{remove:"wine"},{set:"ivan_freed"},{sound:"good"},{say:'Ivan drinks, choking, and colour seeps back into his face. "Grey? You\'re the new one. I left you the letter." He grips your arm. "Listen. The Count lies past the crypt with the last piece in his hands - wear garlic and he will not wake. Ready the carriage before you burn the deed: oats for the mare, and the linchpin is hidden in the courtyard well. And when it burns, he WAKES. Do not walk. RUN - type it, Grey: RUN, and a direction." He tears free of the rusted chains. "Go. I must find her."'},{score:25}]},{verb:["open","push","pull","knock","use"],noun:"vladtomb",do:[{clock:-15},{sound:"scream"},{say:'You push the great lid. It grinds aside an inch - and a hand like a bundle of white twigs shoots out and grabs at the air. A voice like a slammed coffin bellows: "WHO WAKES ME?" You run. By the time you dare come back, the lid is closed again and the crypt is silent. You\'ve lost a quarter of an hour. It is {time}.'}]},{verb:"take",noun:["deed6","countkeys","count"],room:"countstomb",if:["flag:garlic_worn","!flag:p6"],do:[{give:["deed6","countkeys"]},{set:"p6"},{sound:"good"},{say:"Holding your breath, garlic swinging at your neck, you ease the parchment and the ring of keys from between his folded fingers. His nostrils flare at the stink of garlic. His face turns away from you, just slightly... and he does not wake."},{score:25}]},{verb:"take",noun:["deed6","countkeys","count"],room:"countstomb",if:"!flag:p6",do:[{sound:"scream"},{die:'You ease the parchment from his hands. His eyes snap open - red, and very awake. "Mr Grey," he says, almost fondly. "You are early for dinner."'}]},{verb:["attack","use","throw"],noun:["count","stake"],room:"countstomb",do:[{sound:"scream"},{die:'You raise the stake over his heart. Your hands shake. A drop of wax falls from your candle onto his cheek - and his eyes open. "No," he says, quite gently. "Not tonight."'}]},{verb:["take","pour","throw","dig","push","pull"],noun:"earth",room:"countstomb",once:!0,do:[{set:"earth_scattered"},{clock:15},{sound:"good"},{say:"You scoop the earth from the foot of the coffin and scatter it across the chamber floor. The Count's face twitches in his sleep, troubled. He will rest badly tonight - and rise slower. (+15 minutes on every floor.)"},{score:15}]},{verb:["use","open","push","pull"],noun:["trapdoor","crowbar"],room:"bonepassage",if:["has:crowbar","!flag:trap_open"],fail:"It's jammed. You need something to lever it with.",do:[{set:"trap_open"},{say:"You wedge the crowbar into the frame and lean on it. With a crack like a gunshot the trapdoor bursts upward. Moonlight floods down. Above you: the ruined family chapel."},{score:15}]},{verb:"read",noun:"freshgrave",do:[{say:"You lean over the open grave and read the new headstone by moonlight: 'JONATHAN GREY. 1871 - 1897. A WELCOME GUEST.' The earth below is soft and waiting."},{secret:"grave"}]},{verb:["pull","take","use","examine"],noun:["bucket","well"],room:"courtyard",once:!0,do:[{show:"linchpin"},{say:"You haul up the bucket, hand over hand. Inside, wrapped in oilcloth: a long iron LINCHPIN."}]},{verb:["give","use"],noun:["oats","horse"],room:"stables",if:["has:oats","!flag:horse_calm"],do:[{remove:"oats"},{set:"horse_calm"},{sound:"good"},{say:"You offer the oats on your open palm. Nightshade hesitates... then eats, and lets you stroke her neck. Her ears come forward. She'll go with you now."},{score:15}]},{verb:["put","fix","use"],noun:["linchpin","carriage"],room:"stables",if:["has:linchpin","!flag:pin_fitted"],do:[{remove:"linchpin"},{set:"pin_fitted"},{say:"You slide the linchpin through the axle and hammer it home with your heel. The wheel sits true."},{score:15}]},{verb:["tie","use","harness","enter","climb","fix"],noun:["horse","carriage"],room:"stables",if:["flag:horse_calm","flag:pin_fitted","!flag:harnessed"],fail:"She won't stand for the harness - and the carriage isn't fit to drive. Calm the horse and fix the wheel first.",do:[{set:"harnessed"},{say:"You back Nightshade between the shafts and buckle the harness with shaking fingers. You climb up and take the reins."}]},{verb:["unlock","open"],noun:["padlock","countkeys","winch"],room:"gatehouse",if:["has:countkeys","!flag:padlock_open"],fail:"You need a key. The Count would have one.",do:[{set:"padlock_open"},{say:"The Count's key turns in the padlock. It falls open into your hand."}]},{verb:["use","pull","push"],noun:"winch",room:"gatehouse",if:["flag:padlock_open","!flag:portcullis_up"],fail:"The chain is padlocked.",do:[{set:"portcullis_up"},{sound:"portal"},{say:"You throw your weight on the winch. The chain groans, link by link, and the portcullis rises, dripping, into the arch."},{score:10}]},{verb:["show","give","use","peer"],noun:["shard","villagers"],room:"road",if:["has:shard","!flag:villagers_parted"],fail:"They want proof you're human. Something that shows a reflection.",do:[{set:"villagers_parted"},{sound:"good"},{say:"You hold up the mirror shard, then turn it to the torchlight so they can see: your face, reflected, pale and human. A murmur runs through the crowd. Pitchforks lower. Then someone points up at the castle and screams - and every torch turns towards the gate."},{score:20}]},{verb:["light","use","put"],noun:["deed1","deed2","deed3","deed4","deed5","deed6","deed7","altar"],room:"chapel",if:["parts:7",{any:["!flag:horse_calm","!flag:pin_fitted"]},"!flag:deed_burned"],do:[{say:"You hold the pieces over the altar candles - and stop. Ivan's words: when it burns, he wakes. Have the carriage ready first. (Calm the horse and mend the carriage in the stables.)"}]},{verb:["light","use","put"],noun:["deed1","deed2","deed3","deed4","deed5","deed6","deed7","altar","candle"],room:"chapel",if:["parts:7","!flag:deed_burned"],fail:"You need all seven pieces of the deed.",do:[{set:"deed_burned"},{sound:"scream"},{say:"You lay the seven pieces together on the altar and touch them to the candle flame. The parchment catches with a sound like a scream. Blue fire. Your own signature curls and blackens - and the weight you didn't know you were carrying is gone."},{say:"Then, from deep beneath your feet, a howl of rage shakes the chapel. The bell in the tower begins to toll. TRUE MIDNIGHT. The Count is awake - and he knows."},{say:"*** DO NOT WALK. RUN! Type RUN and a direction - RUN FORWARD - to stay ahead of him. Garlic, holy water, the whistle and the stake can slow him down. ***"},{chase:3},{score:50}]},{verb:["drop","put","tie","use","throw","wear"],noun:"garlic",if:["flag:deed_burned","has:garlic"],do:[{remove:"garlic"},{clear:"garlic_worn"},{stun:2},{say:"You tear the garlic from your neck and fling it across the path behind you. A furious hiss from the dark as he swerves around it."}]},{verb:["throw","use","pour"],noun:"holywater",if:["flag:deed_burned","has:holywater"],do:[{remove:"holywater"},{stun:3},{sound:"scream"},{say:"You hurl the vial back the way you came. It shatters - and a shriek splits the night as holy water spatters across him. He reels."}]},{verb:["use","blow"],noun:"whistle",if:["flag:deed_burned","flag:flit_friend","has:whistle"],do:[{stun:2},{say:"You blow the silver whistle. A heartbeat later Flit comes shrieking out of the dark and flies straight at the Count's face, wings beating at his eyes."}]},{verb:["throw","use","attack"],noun:"stake",if:["flag:deed_burned","has:stake"],do:[{remove:"stake"},{stun:1},{say:"You turn and brandish the stake. He checks for half a heartbeat - long enough. You fling it at him and run."}]},{verb:["show","peer","use"],noun:"shard",if:["flag:deed_burned","!in:road","has:shard"],do:[{stun:1},{say:"You flash the mirror shard behind you. He flinches from a reflection that shows nothing - only an empty road."}]},{verb:"go",noun:"forward",room:"road",if:"flag:villagers_parted",do:[{say:"You snap the reins. Nightshade bolts down the mountain road, past the line of torches, the carriage bouncing and swaying. Behind you the villagers close ranks across the gate, and above it all a tall black figure stands on the battlements, cloak streaming, screaming your name into the wind."},{say:"You do not look back."},{say:"Dawn finds you in the valley, Nightshade steaming, the sky turning gold. Far up the mountain, the castle is only a shadow."},{say:[{if:"flag:ivan_freed",text:"In the village inn, three days later, a gaunt man with a beard sits down across from you. Ivan. He says only: 'She came with me as far as the gate. She could go no further. But she knows now that I never left her.' He raises his glass. 'To the living.'"},{text:"Sometimes, at night, you think of the knocking behind the cellar wall, and wonder who it was."}]},{chase:!1},{score:100},{win:"*** YOU HAVE ESCAPED CASTLE DRACULA ***"}]}]});</script>
<script>Starways.addPack({format:1,id:"ice-house",type:"side",title:"The Ice House",author:"FlushtheFashion",hook:{pack:"castle",room:"graveyard",dir:"down",text:"Half-hidden in the grass, stone steps lead DOWN to an old ice house door."},intro:"You go down the steps. The air turns bitterly cold.",start:"steps",rooms:{steps:{name:"Ice House Steps",desc:"Frost-covered steps end at a low chamber. Your breath hangs in the air. The store is FORWARD. The graveyard is UP.",exits:{forward:"store",up:"steps"},hint:"Go FORWARD.",pic:[["bg",0],["rect",14,40,20,80,70],["dither",1,40,20,80,70],["rect",0,64,40,32,50]]},store:{name:"Frozen Store",desc:[{if:"flag:melted",text:"Blocks of ice line the walls. The pale GHOST of a woman stands smiling, her locket in her hands. The steps are BACK."},{text:"Blocks of ice line the walls. The pale GHOST of a woman weeps beside one BLOCK of ice. Frozen inside it, something glints. The steps are BACK."}],exits:{back:"steps"},items:["ghost","block","locket"],hint:[{if:"!flag:melted",text:"Ice melts in a flame. Is your candle lit? Then USE CANDLE ON BLOCK."},{text:"GIVE the LOCKET to the GHOST."}],pic:[["bg",0],["rect",14,0,0,160,100],["dither",6,0,0,160,100],["rect",15,90,50,30,30],["dither",1,90,50,30,30],{if:"!flag:melted",ops:[["plot",7,104,64,105,64]]},["sprite",40,40,2,".111.","11111","10101","11111","11111","1.1.1"]]}},items:{ghost:{name:"ghost",words:["ghost","woman","maud"],npc:!0,scenery:!0,desc:"A see-through woman in an old-fashioned gown. MAUD, said a gravestone up above.",talk:'"My locket... he froze it in the ice so I could never leave. Please..."'},block:{name:"block of ice",words:["block","ice","block of ice"],scenery:!0,desc:"A block of ice. Inside it, a silver locket."},locket:{name:"silver locket",words:["locket","silver locket"],hidden:!0,desc:"A silver locket. Inside, a tiny painting of a smiling young woman."}},actions:[{verb:["use","light","put"],noun:["candle","block"],room:"store",once:!0,if:["lit","!flag:melted"],do:[{set:"melted"},{show:"locket"},{say:"You hold the flame to the ice. Water runs down the block... and the LOCKET drops free."}],fail:"Your candle isn't lit."},{verb:"give",noun:"locket",noun2:"ghost",do:[{remove:["locket","ghost"]},{say:'Maud takes the locket. For a moment she is solid, warm, smiling. "Thank you." Then she is gone, and the cold goes with her.'},{score:20},{secret:"maud"}]},{verb:"go",noun:"up",room:"steps",do:[{return:!0}]}]});</script>
